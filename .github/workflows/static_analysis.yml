name: Static analysis
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      # The SDK depends on host-supplied headers (uECC.h, mbedtls/*, platform
      # logger) that are not vendored here — they are provided by the
      # integrating project (e.g. the ESP32 firmware). We suppress
      # missingInclude rather than try to ship the full toolchain.
      - name: cppcheck (Cryptnox SDK, C++)
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++17 \
            --language=c++ \
            --inline-suppr \
            --error-exitcode=1 \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -I . \
            --force \
            .

      # Coding rule: every variable is initialised where it is declared, so a
      # read before the first write sees a known value. cppcheck only reports
      # reads of uninitialised data, not declarations. Both checks below work
      # on the compiler's AST, so they cover every type with no list to keep:
      #  - clang-tidy: scalars, pointers, plain structs, and members a
      #    constructor leaves unset (it skips arrays, hence clang-query).
      #  - clang-query: any variable, arrays included, with no initialiser.
      - name: Install clang tools
        run: sudo apt-get install -y clang-tidy clang-tools

      - name: Uninitialised members and variables (clang-tidy)
        run: |
          clang-tidy \
            -checks='-*,cppcoreguidelines-init-variables,cppcoreguidelines-pro-type-member-init' \
            -header-filter='.*' \
            -warnings-as-errors='*' \
            *.cpp fuzz/*.cpp \
            -- -std=c++17 -I . -DCW_FUZZ_BUILD=1

      - name: Uninitialised variables and arrays (clang-query)
        run: |
          clang-query \
            -c 'match varDecl(unless(parmVarDecl()), unless(hasInitializer(anything())), unless(isExpansionInSystemHeader()))' \
            *.cpp fuzz/*.cpp \
            -- -std=c++17 -I . -DCW_FUZZ_BUILD=1 | tee clang-query.log
          if grep -qE '^[1-9][0-9]* match' clang-query.log; then
            echo "::error::Uninitialised declaration(s) above: add '= { 0U }' or '{}'."
            exit 1
          fi

      - name: Host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I . \
            tests/test_host.cpp CryptnoxWallet.cpp CW_SecureChannel.cpp CW_Utils.cpp \
            -o test_host
          ./test_host

      - name: Host tests (ASan + UBSan)
        run: |
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -I . \
            tests/test_host.cpp CryptnoxWallet.cpp CW_SecureChannel.cpp CW_Utils.cpp \
            -o test_host_san
          ./test_host_san

      - name: TRON self-test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -DCW_TRON_SELFTEST -I . \
            CW_Tron.cpp CW_Utils.cpp -o cw_tron_selftest
          ./cw_tron_selftest

      # Each of these must FAIL to compile: disabling card verification needs
      # the explicit opt-in, never in an NDEBUG build, and the applet gate
      # must not silently truncate.
      - name: Build-flag guards
        run: |
          for flags in "-DCW_VERIFY_CERT=0" "-DCW_VERIFY_CERT=0&&1" \
                       "-DCW_VERIFY_CERT=0 -DCW_ALLOW_UNVERIFIED_CARD=1 -DNDEBUG" \
                       "-DCW_MIN_APPLET_MAJOR=256"; do
            if echo '#include "CW_Defs.h"' | g++ -x c++ -std=c++17 -fsyntax-only -I . $flags - 2>/dev/null; then
              echo "::error::'$flags' compiled but must be refused."
              exit 1
            fi
          done
          echo '#include "CW_Defs.h"' | g++ -x c++ -std=c++17 -fsyntax-only -I . \
            -DCW_VERIFY_CERT=0 -DCW_ALLOW_UNVERIFIED_CARD=1 -

      - name: DER fuzzer (60 s)
        run: |
          sudo apt-get install -y clang
          clang++ -std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined \
            -DCW_FUZZ_BUILD=1 -DCW_DEBUG_LOGGING=0 -I . fuzz/fuzz_der.cpp -o fuzz_der
          mkdir -p fuzz-corpus
          ./fuzz_der fuzz-corpus -max_total_time=60 -max_len=512
